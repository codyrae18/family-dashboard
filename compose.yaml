services:
  postgres:
    image: postgres:16-alpine
    container_name: family-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-family_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-family_app} -d ${POSTGRES_DB:-family_dashboard}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: