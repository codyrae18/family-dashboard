spring:
  application:
    name: family-dashboard

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/family_dashboard}
    username: ${DB_USERNAME:family_app}
    password: ${DB_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug